name: partner-commissions

services:
  postgres-users:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: users
    ports:
      - "5432:5432"
    volumes:
      - users-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d users"]
      interval: 2s
      timeout: 5s
      retries: 20

  postgres-commissions:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: commissions
    ports:
      - "5433:5432"
    volumes:
      - commissions-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d commissions"]
      interval: 2s
      timeout: 5s
      retries: 20

  postgres-wallets:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wallets
    ports:
      - "5434:5432"
    volumes:
      - wallets-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wallets"]
      interval: 2s
      timeout: 5s
      retries: 20

  users-api:
    image: partner-commissions-users
    build:
      context: .
      args:
        PROJECT_PATH: src/PartnerCommissions.Users.Api/PartnerCommissions.Users.Api.csproj
    command: ["PartnerCommissions.Users.Api.dll"]
    ports:
      - "8081:8081"
      - "8181:8181"
    environment:
      ConnectionStrings__Users: "Host=postgres-users;Port=5432;Database=users;Username=postgres;Password=postgres;GSS Encryption Mode=Disable"
      Logging__Console__FormatterName: json
      Logging__Console__FormatterOptions__TimestampFormat: O
      Logging__Console__FormatterOptions__UseUtcTimestamp: "true"
    depends_on:
      postgres-users:
        condition: service_healthy
    pre_start:
      - command: ["PartnerCommissions.Users.Api.dll", "migrate"]

  commissions-api:
    image: partner-commissions-commissions
    build:
      context: .
      args:
        PROJECT_PATH: src/PartnerCommissions.Commissions.Api/PartnerCommissions.Commissions.Api.csproj
    command: ["PartnerCommissions.Commissions.Api.dll"]
    ports:
      - "8082:8082"
      - "8182:8182"
    environment:
      ConnectionStrings__Commissions: "Host=postgres-commissions;Port=5432;Database=commissions;Username=postgres;Password=postgres;GSS Encryption Mode=Disable"
      Users__GrpcAddress: http://users-api:8181
      Logging__Console__FormatterName: json
      Logging__Console__FormatterOptions__TimestampFormat: O
      Logging__Console__FormatterOptions__UseUtcTimestamp: "true"
    depends_on:
      postgres-commissions:
        condition: service_healthy
    pre_start:
      - command: ["PartnerCommissions.Commissions.Api.dll", "migrate"]

  wallets-api:
    image: partner-commissions-wallets
    build:
      context: .
      args:
        PROJECT_PATH: src/PartnerCommissions.Wallets.Api/PartnerCommissions.Wallets.Api.csproj
    command: ["PartnerCommissions.Wallets.Api.dll"]
    ports:
      - "8083:8083"
    environment:
      ConnectionStrings__Wallets: "Host=postgres-wallets;Port=5432;Database=wallets;Username=postgres;Password=postgres;GSS Encryption Mode=Disable"
      Commissions__GrpcAddress: http://commissions-api:8182
      Logging__Console__FormatterName: json
      Logging__Console__FormatterOptions__TimestampFormat: O
      Logging__Console__FormatterOptions__UseUtcTimestamp: "true"
    depends_on:
      postgres-wallets:
        condition: service_healthy
    pre_start:
      - command: ["PartnerCommissions.Wallets.Api.dll", "migrate"]

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  loki:
    image: grafana/loki:3.7.0
    user: root
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      - "3100:3100"
    volumes:
      - ./deploy/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

  alloy:
    image: grafana/alloy:v1.19.2
    user: root
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./deploy/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:13.2.1
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

volumes:
  users-data:
  commissions-data:
  wallets-data:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:
